<html>
<head>
  <title>Form</title>
</head>
  <body>

    <h3>Welcome to my html project webpage</h3>
    <p>please fill out this form:</p>
    
    <form action="Final project.html" method="get">
      
  <label for="name">Username :</label>
  <input required type="text"
    id="name"
    name="username"
    placeholder="Enter ur name">
      
<br><br>

      
      <label for="email">Email:</label>
  <input required type="email"
    id="email" 
    name="email"
    placeholder="Enter ur email">

<br><br>
      
      <label for="Password">Password:</label>
      <input required type="password"
        id="Password"
        name="Password"
        placeholder="Enter ur password">
      
      <br><br>
      
      <label for="telephone">phone:</label>
<input type="tel"
  id="telephone"
  name="telephone"
  placeholder="Enter ur phone number">

      <br><br>

      <label for="date">Date:</label>
      <input type="date"
        id="date"
        name="date">
      
      <br><br>

      <label for="time">Time:</label>
      <input type="time"
        id="time"
        name="time">

      <br><br>

      <label for="gender">Gender:</label>
      <select id="gender" name="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <br><br>

      <label>do u use AI:</label>
      <br><br>
      <input type="radio"
        id="yes"
        name="answer"
        value="yes">
        <label for="yes">yes</label>

      <input type="radio"
        id="no"
        name="answer"
        value="no">
        <label for="no">no</label>

      <br><br>  
      <img src="Ai2.jpg" width="150">
      
    <br><br>
      <label>which AI do u like:</label>
      <br>
       
      <br><br>

      <input type="checkbox" 
        id="Claude"
        name="Claude"
        value="Claude">
        <label for="Claude">Claude</label>

      <input type="checkbox"
        id="ChatGPT"
        name="ChatGPT"
        value="ChatGPT">
        <label for="ChatGPT">ChatGPT</label>

      <input type="checkbox"
        id="Gemini"
        name="Gemini"
        value="Gemini">
        <label for="Gemini">Gemini</label>

<br><br>
      
      <button type="submit">Submit</button>
      

      
    </form>
    
  </body>

</html>
